name: Build and Release IPK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build All-Arch IPK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Package Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0.0"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Build IPK Packages
        run: |
          chmod +x build.sh
          PKG_VERSION="${{ steps.vars.outputs.version }}" ./build.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pppoe-users-ipk
          path: bin/*.ipk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release v${{ steps.vars.outputs.version }}
          draft: false
          prerelease: false
          files: bin/*.ipk
          body: |
            ### LuCI PPPoE Server User Accounts (Universal All-Architecture IPK)

            #### Packages included:
            - `luci-app-pppoe-users_${{ steps.vars.outputs.version }}-1_all.ipk`
            - `pppoeuser_${{ steps.vars.outputs.version }}-1_all.ipk` (legacy compatibility name)

            #### Installation:
            ```bash
            opkg update
            opkg install rp-pppoe-server
            opkg install luci-app-pppoe-users_${{ steps.vars.outputs.version }}-1_all.ipk
            /etc/init.d/rpcd restart
            /etc/init.d/uhttpd restart
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
